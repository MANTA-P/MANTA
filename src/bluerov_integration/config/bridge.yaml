# BlueROV Gazebo <-> ROS 2 bridge.
# ROS 2 추진기 명령은 Gazebo로 보내고, IMU와 Odometry는 ROS 2로 받는다.

- ros_topic_name: "/model/bluerov2/joint/thruster1_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster1_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/joint/thruster2_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster2_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/joint/thruster3_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster3_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/joint/thruster4_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster4_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/joint/thruster5_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster5_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/joint/thruster6_joint/cmd_thrust"
  gz_topic_name: "/model/bluerov2/joint/thruster6_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/bluerov2/imu"
  gz_topic_name: "/world/oceans_waves/model/bluerov2/link/base_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/bluerov2/odometry"
  gz_topic_name: "/model/bluerov2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

# Pressure: Gazebo -> ROS 2
- ros_topic_name: "/model/bluerov2/pressure"
  gz_topic_name: "model/bluerov2/Pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "ignition.msgs.FluidPressure"
  direction: GZ_TO_ROS
