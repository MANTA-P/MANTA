torpedo_manual_control_v2:
  ros__parameters:
    thrust_topic: "/torpedo/actuators/thruster/command"
    fin_top_topic: "/torpedo/actuators/fins/top/command"
    fin_bottom_topic: "/torpedo/actuators/fins/bottom/command"
    fin_left_topic: "/torpedo/actuators/fins/left/command"
    fin_right_topic: "/torpedo/actuators/fins/right/command"

    nose_push_key: "w"
    nose_pull_key: "s"
    yaw_left_key: "a"
    yaw_right_key: "d"
    thrust_increase_key: "r"
    thrust_decrease_key: "f"
    thrust_stop_key: " "
    auto_track_key: "t"

    thrust_initial: 0.0
    thrust_step: 1500.0
    thrust_min: 0.0
    thrust_max: 1500.0
    fin_command_rad: 0.05
    # Physical joint command range from model.sdf.
    fin_min_rad: -0.50
    fin_max_rad: 0.50
    fin_limit_rad: 0.50
    publish_rate_hz: 20.0
    p_gain_pitch: 0.8
    p_gain_yaw: 0.8

    # Roll stabilization uses body roll angle and body angular_y (roll rate).
    # The correction is applied differentially to Top/Bottom so the common
    # component remains the Yaw command.
    roll_control_enabled: true
    roll_kp: 0.6
    roll_kd: 0.15
    roll_limit_rad: 0.10
    roll_input_sign: -1.0
    roll_top_sign: 1.0
    roll_bottom_sign: -1.0

    odometry_topic: "/torpedo/state/odometry"
    target_odometry_topic: "/model/bluerov2/odometry"
    joint_states_topic: "/torpedo/state/joint_states"
    propeller_front_joint_name: "propeller_joint"
    propeller_rear_joint_name: "propeller_rear_joint"
    fin_top_joint_name: "fin_top_joint"
    fin_bottom_joint_name: "fin_bottom_joint"
    fin_left_joint_name: "fin_left_joint"
    fin_right_joint_name: "fin_right_joint"

    # These signs are still test inputs. Validate each direction in SITL.
    thrust_output_sign: 1.0
    # Retained model behavior: positive Left/Right fin command produces
    # negative body pitch. Invert it so W means positive body pitch.
    pitch_input_sign: -1.0
    # Retained logs show positive Top/Bottom fin command produces negative
    # body wz. Invert the command so A (Yaw left / +Z) and auto tracking use
    # the physical yaw direction consistently.
    yaw_input_sign: -1.0
    pitch_left_sign: 1.0
    pitch_right_sign: 1.0
    yaw_top_sign: 1.0
    yaw_bottom_sign: 1.0

    fin_top_neutral_rad: 0.0
    fin_bottom_neutral_rad: 0.0
    fin_left_neutral_rad: 0.0
    fin_right_neutral_rad: 0.0

    log_enabled: true
    log_directory: "~/.ros/torpedo_control_v2_logs"
    log_flush_every_n_rows: 1

    # Queues are bounded so overload is visible instead of blocking control.
    # Overflow counters are written into control_cycle.csv.
    sensor_queue_capacity: 8192
    key_queue_capacity: 1024
    logger_queue_capacity: 100000
