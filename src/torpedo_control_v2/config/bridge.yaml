---
# ROS 2 command topics -> Gazebo Transport actuator topics.
# The four fin Gazebo topics are explicitly defined in the current model.sdf.
# One common ROS thrust command is intentionally fanned out to the Gazebo
# cmd_thrust topics for propeller_joint and propeller_rear_joint.

# 전방 프로펠러
- ros_topic_name: "/torpedo/actuators/thruster/command"
  gz_topic_name: "/model/glider_slocum/joint/propeller_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# 후방 프로펠러
- ros_topic_name: "/torpedo/actuators/thruster/command"
  gz_topic_name: "/model/glider_slocum/joint/propeller_rear_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/torpedo/actuators/fins/top/command"
  gz_topic_name: "/model/glider_slocum/joint/fin_top/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/torpedo/actuators/fins/bottom/command"
  gz_topic_name: "/model/glider_slocum/joint/fin_bottom/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/torpedo/actuators/fins/left/command"
  gz_topic_name: "/model/glider_slocum/joint/fin_left/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/torpedo/actuators/fins/right/command"
  gz_topic_name: "/model/glider_slocum/joint/fin_right/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# State topics used by the CSV logger.
- ros_topic_name: "/torpedo/state/odometry"
  gz_topic_name: "/model/glider_slocum/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# dave_ocean_waves.world has the internal Gazebo world name "oceans_waves".
- ros_topic_name: "/torpedo/state/joint_states"
  gz_topic_name: "/world/oceans_waves/model/glider_slocum/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
